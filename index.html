<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tama Talk – English Pet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@700;800&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="petName" class="pill"><span id="nameTxt">Tama Talk</span><small id="stageTxt"></small></div>
    <div id="ageBox" class="pill">Age <b id="ageTxt">0</b></div>
    <div id="growBox" class="pill" title="Growth"><span>🌱</span><div id="growBar"><div id="growFill"></div></div></div>
    <div id="starBox" class="pill" title="Stars – spend them in the shop">⭐ <b id="starTxt">0</b></div>
    <div class="spacer"></div>
    <button id="viewBtn" class="round wide" title="Tamagotchi view"><span id="viewIc">🥚</span> <span id="viewLb">Tama view</span></button>
    <button id="shopBtn" class="round" title="Shop">🛍️</button>
    <button id="diaryBtn" class="round" title="Diary">📔</button>
    <button id="albumBtn" class="round" title="Album">📖</button>
    <button id="soundBtn" class="round" title="Sound effects on/off">🔔</button>
  </header>

  <main id="main">
    <section id="talkCol">
      <div id="bubble" class="hidden">
        <div id="bubbleWho" class="hidden"></div>
        <div id="bubbleText"></div>
                <div id="bubbleBtns"><button id="hintBtn" class="mini" title="Hint">💡 Hint</button><button id="goBtn" class="big hidden">OK! ▶</button></div>
      </div>
    </section>

    <section id="stageCol">
      <div id="shell">
        <div id="shellLogo">Tama Talk</div>
        <div id="screenWrap">
          <div id="screen">
            <div id="bgLayer"></div>
            <div id="emojiLayer"></div>
            <canvas id="pet" width="96" height="96"></canvas>
            <div id="nightLayer" class="hidden"></div>
            <canvas id="fxc" width="96" height="96"></canvas>
          </div>
          <div id="iconsTop" class="icons"></div>
          <div id="iconsBot" class="icons"></div>
        </div>
        <div id="shellBtns"><button data-b="A" class="left" title="A: next"></button><button data-b="B" class="main" title="B: choose"></button><button data-b="C" class="right" title="C: back"></button></div>
      </div>
    </section>

    <section id="sideCol">
      <div id="tray" class="hidden">
        <div id="trayHead"><span id="trayTitle"></span><button id="trayClose" class="mini">✖</button></div>
        <div id="trayGrid"></div>
      </div>
      <div id="profile"></div>
      <div id="actPanel" class="hidden"><div id="apHead"></div><div id="apBody"></div></div>
    </section>

    <div id="eggChoice" class="card hidden">
      <h1>Tama Talk</h1>
      <p class="en">Choose an egg!</p>
      <div id="eggRow"></div>
    </div>
    <div id="nameCard" class="card hidden">
      <p class="en">Hello! What's my name?</p>
      <input id="nameInput" maxlength="10" autocomplete="off" spellcheck="false" placeholder="Pochi">
      <button id="nameOk" class="big">OK</button>
    </div>
    <div id="byeCard" class="card hidden">
      <div class="bigstar">🌟</div>
      <p id="byeEn" class="en"></p>
      <div id="byeStats"></div>
      <button id="newEggBtn" class="big">New egg 🥚</button>
    </div>
    <div id="tapEgg" class="hidden"><span class="en">Tap the egg!</span></div>
  </main>

  <nav id="cats"></nav>
  <div id="fxApp"></div>

  <div id="modalBack" class="hidden">
    <div id="shop" class="modal hidden">
      <h2>🛍️ Shop <span class="wallet">⭐ <b id="shopStars">0</b></span></h2>
      <div class="tabs"><button data-tab="acc" class="on">🎩 Accessories</button><button data-tab="room">🏠 Rooms</button><button data-tab="shell">🥚 Shells</button></div>
      <div id="shopGrid"></div>
      <button class="big closeModal">Close</button>
    </div>
    <div id="diaryBook" class="modal hidden">
      <h2>📔 My book</h2>
      <div class="tabs" id="diaryTabs"><button data-tab="diary" class="on">📔 Diary</button><button data-tab="letters">💌 Letters</button><button data-tab="badges">🏅 Badges</button></div>
      <div id="diaryList"></div>
      <button class="big closeModal">Close</button>
    </div>
    <div id="album" class="modal hidden">
      <h2>📖 Album</h2>
      <div id="albumList"></div>
      <button class="big closeModal">Close</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/needs.js"></script>
<script src="js/growth.js"></script>
<script src="js/bbox.js"></script>
<script src="js/assets.js"></script>
<script src="js/game.js"></script>
<script src="js/activities.js"></script>
<script src="js/places.js"></script>
</body>
</html>
